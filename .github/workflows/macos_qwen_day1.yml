name: qwen-day1-macos

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  run-day1:
    runs-on: macos-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONHASHSEED: "1234"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ runner.os }}-hf-qwen2-0_5b

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Qwen startup self-check
        run: python run_all.py --qwen-startup-selfcheck

      - name: Qwen sanity check mode
        run: python run_all.py --sanity-check-llm

      - name: Full day1 experiments
        run: python run_all.py --qwen-startup-selfcheck --debug-llm

      - name: Summarize
        run: python scripts/summarize_results.py --raw results/results_raw.csv --out results/results_summary.csv

      - name: Plot
        run: python scripts/plot_results.py --raw results/results_raw.csv --outdir results

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-day1-artifacts
          path: |
            results/*.csv
            results/*.jsonl
            results/*.txt
            results/*.png
