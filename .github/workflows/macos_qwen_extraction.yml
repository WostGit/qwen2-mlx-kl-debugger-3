name: qwen-mlx-extraction

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  run-experiments:
    runs-on: macos-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: ${{ github.workspace }}/.hf_cache
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache HF downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Qwen startup self-check
        run: python scripts/selfcheck_qwen.py --output results/qwen_startup_selfcheck.txt

      - name: Qwen sanity check only
        run: python run_all.py --sanity-check-llm

      - name: Run full Day 1 experiments
        run: python run_all.py --multi-seed 0,1,2 --debug-llm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mlx-artifacts
          path: |
            results/*.csv
            results/*.jsonl
            results/*.txt
            results/*.png
