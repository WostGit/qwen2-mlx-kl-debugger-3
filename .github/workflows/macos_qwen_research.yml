name: macos-qwen-research

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  run-research:
    runs-on: macos-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache HF model downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf_cache
          key: ${{ runner.os }}-hf-qwen2-05b

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Qwen startup self-check
        run: python run_all.py --qwen-selfcheck --results-dir results

      - name: Qwen sanity check
        run: python run_all.py --sanity-check-llm --results-dir results

      - name: Full Day-1 experiments
        run: python run_all.py --debug-llm --results-dir results

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-research-artifacts
          path: |
            results/*.csv
            results/*.jsonl
            results/*.txt
            results/*.png
